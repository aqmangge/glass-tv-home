plugins {
    id 'com.android.application'
}

android {
    namespace 'com.belajarceria.kids'
    compileSdk 34

    defaultConfig {
        applicationId 'com.belajarceria.kids'
        minSdk 26
        targetSdk 34
        versionCode 12
        versionName '1.7.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded, not published on Play: sign with the debug key so the CI APK installs as is.
            signingConfig signingConfigs.debug
        }
    }

    lint {
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No dependencies: every screen, animation and sound is drawn or synthesised in code, so the APK stays tiny.
